name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          unzip -o *.zip
          FOLDER=$( find . -name "gradlew" -type f | head -n 1 | xargs dirname)
          echo "Dossier: $FOLDER"
          echo '{"project_info":{"project_number":"123","project_id":"d","storage_bucket":"d.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.cinesuivi"}},"oauth_client":[],"api_key":[{"current_key":"AIzaDummy"}],"services":{}}],"configuration_version":"1"}' > $FOLDER/app/google-services.json
          cd $FOLDER
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cinesuivi-APK
          path: "**/app/build/outputs/apk/debug/*.apk
