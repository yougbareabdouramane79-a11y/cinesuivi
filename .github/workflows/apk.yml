name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          unzip -o Cin-suivii-main.zip
          mv Cin-suivii-main Cinesuivi
          echo '{"project_info":{"project_number":"123","project_id":"d","storage_bucket":"d.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:abc","android_client_info":{"package_name":"com.cinesuivi"}},"oauth_client":[],"api_key":[{"current_key":"AIzaDummy"}],"services":{}}],"configuration_version":"1"}' > Cinesuivi/app/google-services.json
          cd Cinesuivi
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cinesuivi-APK
          path: Cinesuivi/app/build/outputs/apk/debug/*.apk
